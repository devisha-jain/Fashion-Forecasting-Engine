system:
  name: "AI-Powered Fashion Trend Intelligence & Forecasting System"
  version: "2.0.0"
  academic_discipline: "Natural Language Processing (NLP) & Large Language Models (LLM)"
  environment: "development"

llm:
  provider: "google"
  model: "gemini-2.5-flash"
  fallback_model: "gemini-1.5-flash"
  temperature: 0.2
  max_output_tokens: 2048
  retry_count: 2
  timeout_seconds: 30
  min_confidence: 0.65

nlp:
  max_text_length: 10000

  preprocessing:
    lowercase: true
    remove_stopwords: true
    lemmatize: true
    remove_punctuation: true

  tfidf:
    max_features: 50
    ngram_range: [1, 2]
    min_df: 1
    max_df: 1.0

  keyword_limit: 15
  entity_confidence_threshold: 0.65

forecasting:
  default_region: "Pan India"
  default_year: "current"

  trend_score_weights:
    google_trends_momentum: 0.30
    nlp_keyword_prominence: 0.25
    semantic_confidence: 0.20
    sentiment_valence: 0.15
    source_diversity: 0.10

  trend_stages:
    emerging:
      min_score: 75
      description: "Early-stage trend showing increasing search momentum and early adoption"

    growing:
      min_score: 55
      description: "Trend showing increasing consumer interest and broader adoption"

    stable:
      min_score: 35
      description: "Established trend showing relatively consistent consumer interest"

    declining:
      min_score: 0
      description: "Trend showing decreasing momentum or reduced consumer interest"

caching:
  enabled: true
  ttl_seconds: 86400
  engine: "redis"

api:
  request_timeout_seconds: 30
  max_requests_per_minute: 30

validation:
  require_json_schema: true
  reject_invalid_llm_output: true
  require_evidence_for_trends: true

logging:
  level: "INFO"
  track_latency: true
  track_token_usage: true

images:
  unsplash_fallback_count: 3
